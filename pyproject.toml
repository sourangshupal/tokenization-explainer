[project]
name = "tokenization-explainer"
version = "0.1.0"
description = "Beginner course: tokenization taxonomy, BPE, WordPiece, and SentencePiece"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.3",
    "nbformat>=5.11.1",
    "rich>=14",
    "sentencepiece>=0.2.2",
    "tiktoken>=0.14.0",
    "tokenizers>=0.21.0",
    # production tokenizer pipeline
    "datasets>=3.3.0",
    "transformers>=5.0.0",
    "huggingface_hub>=0.30.0",
    "numpy>=2.0.0",
    "pytest>=8.4.0",
    "tqdm>=4.67.0",
]

[tool.uv]
package = false
