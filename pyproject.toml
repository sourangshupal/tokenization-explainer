[project]
name = "tokenization-explainer"
version = "0.1.0"
description = "Medical custom vs general tokenizer lab"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "nbformat>=5.11.1",
    "rich>=14",
    "tiktoken>=0.14.0",
    "tokenizers>=0.23.1",
    "datasets>=3.6.0",
    "transformers>=5.16.1",
    "huggingface_hub>=0.30.0",
    "numpy>=2.0.0",
    "pytest>=8.4.0",
    "tqdm>=4.67.0",
]

[project.optional-dependencies]
sft = [
    "torch>=2.8.0",
    "accelerate>=1.14.0",
    "peft>=0.20.0",
    "trl>=1.12.0",
]

[tool.uv]
package = false
