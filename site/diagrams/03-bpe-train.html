<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BPE train loop · Token Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #fafafa;
      --ink: #18181b;
      --muted: #71717a;
      --accent: #0891b2;
      --font-sans: "Geist", system-ui, sans-serif;
      --font-serif: "Instrument Serif", serif;
      --font-mono: "Geist Mono", ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1040px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 0.5rem;
    }
    .sub {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      max-width: 56ch;
    }
    svg { width: 100%; min-width: 720px; display: block; }
    .back {
      display: inline-block;
      margin-top: 1.5rem;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--accent);
      text-decoration: none;
      letter-spacing: 0.06em;
    }
    .back:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Token Lab / 03</p>
    <h1>BPE train loop</h1>
    <p class="sub">Split words into characters, mark ends with <code style="font-family:var(--font-mono);color:var(--accent)">&lt;/w&gt;</code>, then repeatedly glue the most frequent adjacent pair.</p>

    <svg viewBox="0 0 720 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BPE training merge loop">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#71717a" />
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#0891b2" />
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafafa" />

      <!-- Vertical spine arrows -->
      <line x1="360" y1="72" x2="360" y2="96" stroke="#71717a" stroke-width="1.2" marker-end="url(#arrow)" />
      <line x1="360" y1="160" x2="360" y2="184" stroke="#71717a" stroke-width="1.2" marker-end="url(#arrow)" />
      <line x1="360" y1="248" x2="360" y2="272" stroke="#71717a" stroke-width="1.2" marker-end="url(#arrow)" />
      <line x1="360" y1="336" x2="360" y2="360" stroke="#0891b2" stroke-width="1.4" marker-end="url(#arrow-accent)" />
      <line x1="360" y1="424" x2="360" y2="448" stroke="#71717a" stroke-width="1.2" marker-end="url(#arrow)" />
      <line x1="360" y1="528" x2="360" y2="552" stroke="#71717a" stroke-width="1.2" marker-end="url(#arrow)" />

      <!-- Loop back: from diamond NO left, up, into count -->
      <path d="M 280,488 H 120 Q 112,488 112,480 V 216 Q 112,208 120,208 H 280"
            fill="none" stroke="#71717a" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)" />
      <rect x="96" y="336" width="48" height="12" rx="2" fill="#fafafa" />
      <text x="120" y="346" fill="#71717a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOOP</text>

      <!-- Start -->
      <rect x="280" y="24" width="160" height="48" rx="24" fill="rgba(24,24,27,0.03)" stroke="rgba(24,24,27,0.30)" stroke-width="1" />
      <text x="360" y="52" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Corpus + counts</text>

      <!-- Split -->
      <rect x="260" y="96" width="200" height="64" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1" />
      <text x="360" y="124" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Split to characters</text>
      <text x="360" y="144" fill="#71717a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">append &lt;/w&gt;</text>

      <!-- Count -->
      <rect x="260" y="184" width="200" height="64" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1" />
      <text x="360" y="220" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Count adjacent pairs</text>

      <!-- Pick (focal) -->
      <rect x="260" y="272" width="200" height="64" rx="6" fill="rgba(8,145,178,0.10)" stroke="#0891b2" stroke-width="1.4" />
      <text x="360" y="300" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pick max frequency</text>
      <text x="360" y="320" fill="#0891b2" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">BPE scoring rule</text>

      <!-- Merge -->
      <rect x="260" y="360" width="200" height="64" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1" />
      <text x="360" y="396" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Glue pair → vocab</text>

      <!-- Diamond enough? -->
      <polygon points="360,448 440,488 360,528 280,488" fill="#ffffff" stroke="#18181b" stroke-width="1" />
      <text x="360" y="484" fill="#18181b" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">N merges?</text>
      <text x="360" y="500" fill="#71717a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">done?</text>

      <!-- YES label -->
      <rect x="368" y="532" width="28" height="12" rx="2" fill="#fafafa" />
      <text x="382" y="542" fill="#71717a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>

      <!-- NO label on loop -->
      <rect x="200" y="476" width="24" height="12" rx="2" fill="#fafafa" />
      <text x="212" y="486" fill="#71717a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>

      <!-- End -->
      <rect x="280" y="552" width="160" height="48" rx="24" fill="rgba(24,24,27,0.03)" stroke="rgba(24,24,27,0.30)" stroke-width="1" />
      <text x="360" y="580" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Save merge list</text>

      <!-- Aside -->
      <text x="520" y="128" fill="#71717a" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">&lt;/w&gt; separates</text>
      <text x="520" y="148" fill="#71717a" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">st in star vs widest</text>
    </svg>

    <a class="back" href="index.html">← All diagrams</a>
  </div>
</body>
</html>
