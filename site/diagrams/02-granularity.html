<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Granularity tradeoff · Token Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #fafafa;
      --ink: #18181b;
      --muted: #71717a;
      --accent: #0891b2;
      --font-sans: "Geist", system-ui, sans-serif;
      --font-serif: "Instrument Serif", serif;
      --font-mono: "Geist Mono", ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1040px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 0.5rem;
    }
    .sub {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      max-width: 56ch;
    }
    svg { width: 100%; min-width: 720px; display: block; }
    .back {
      display: inline-block;
      margin-top: 1.5rem;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--accent);
      text-decoration: none;
      letter-spacing: 0.06em;
    }
    .back:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layer stack · Token Lab / 02</p>
    <h1>What is one token?</h1>
    <p class="sub">Coarser units → shorter sequences, bigger vocab, more OOV. Finer units flip the tradeoff. Subword is the industry compromise.</p>

    <svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Granularity layers from word to byte">
      <rect width="100%" height="100%" fill="#fafafa" />

      <!-- Direction -->
      <text x="40" y="72" fill="#71717a" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">COARSE</text>
      <line x1="56" y1="84" x2="56" y2="360" stroke="rgba(24,24,27,0.30)" stroke-width="1" />
      <polygon points="52,84 60,84 56,76" fill="#71717a" />
      <polygon points="52,360 60,360 56,368" fill="#71717a" />
      <text x="40" y="392" fill="#71717a" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">FINE</text>

      <!-- Stack outline -->
      <line x1="96" y1="64" x2="880" y2="64" stroke="rgba(24,24,27,0.12)" stroke-width="1" />
      <line x1="96" y1="384" x2="880" y2="384" stroke="rgba(24,24,27,0.12)" stroke-width="1" />

      <!-- L1 Word -->
      <rect x="96" y="64" width="784" height="80" fill="#ffffff" stroke="rgba(24,24,27,0.12)" stroke-width="1" />
      <text x="120" y="100" fill="#a1a1aa" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L1</text>
      <text x="168" y="104" fill="#18181b" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Word</text>
      <text x="840" y="104" fill="#71717a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">vocab huge · seq short · OOV pain</text>

      <!-- L2 Subword (focal) -->
      <rect x="96" y="144" width="784" height="80" fill="rgba(8,145,178,0.10)" stroke="#0891b2" stroke-width="1.4" />
      <text x="120" y="180" fill="#0891b2" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L2</text>
      <text x="168" y="184" fill="#18181b" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Subword</text>
      <text x="840" y="184" fill="#0891b2" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">BPE · WordPiece · SentencePiece</text>

      <!-- L3 Character -->
      <rect x="96" y="224" width="784" height="80" fill="#f4f4f5" stroke="rgba(24,24,27,0.12)" stroke-width="1" />
      <text x="120" y="260" fill="#a1a1aa" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L3</text>
      <text x="168" y="264" fill="#18181b" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Character</text>
      <text x="840" y="264" fill="#71717a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">vocab small · seq long</text>

      <!-- L4 Byte -->
      <rect x="96" y="304" width="784" height="80" fill="#ffffff" stroke="rgba(24,24,27,0.12)" stroke-width="1" />
      <text x="120" y="340" fill="#a1a1aa" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L4</text>
      <text x="168" y="344" fill="#18181b" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Byte</text>
      <text x="840" y="344" fill="#71717a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">0–255 base · no UNK · GPT-2+</text>

      <!-- Legend -->
      <line x1="96" y1="416" x2="880" y2="416" stroke="rgba(24,24,27,0.12)" stroke-width="0.8" />
      <text x="96" y="440" fill="#71717a" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="188" y="428" width="14" height="14" rx="3" fill="rgba(8,145,178,0.10)" stroke="#0891b2" stroke-width="1.2" />
      <text x="210" y="439" fill="#18181b" font-size="11" font-family="'Geist', sans-serif">Industry default (subword)</text>
      <text x="520" y="439" fill="#71717a" font-size="11" font-family="'Geist', sans-serif">Right labels = vocab vs length tradeoff</text>
    </svg>

    <a class="back" href="index.html">← All diagrams</a>
  </div>
</body>
</html>
