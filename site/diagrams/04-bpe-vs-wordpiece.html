<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BPE vs WordPiece · Token Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #fafafa;
      --ink: #18181b;
      --muted: #71717a;
      --accent: #0891b2;
      --font-sans: "Geist", system-ui, sans-serif;
      --font-serif: "Instrument Serif", serif;
      --font-mono: "Geist Mono", ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1040px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 0.5rem;
    }
    .sub {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      max-width: 56ch;
    }
    svg { width: 100%; min-width: 720px; display: block; }
    .back {
      display: inline-block;
      margin-top: 1.5rem;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--accent);
      text-decoration: none;
      letter-spacing: 0.06em;
    }
    .back:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Token Lab / 04</p>
    <h1>BPE vs WordPiece scoring</h1>
    <p class="sub">Same glue step. Different ranking. BPE picks raw frequency; WordPiece picks a likelihood ratio.</p>

    <svg viewBox="0 0 880 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BPE frequency versus WordPiece score then shared merge">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#71717a" />
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#0891b2" />
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafafa" />

      <!-- Shared start -->
      <line x1="440" y1="72" x2="440" y2="96" stroke="#71717a" stroke-width="1.2" marker-end="url(#arrow)" />
      <!-- Fork left and right from under pair count -->
      <path d="M 440,160 V 176 H 220 Q 212,176 212,184 V 200"
            fill="none" stroke="#71717a" stroke-width="1.2" marker-end="url(#arrow)" />
      <path d="M 440,160 V 176 H 660 Q 668,176 668,184 V 200"
            fill="none" stroke="#71717a" stroke-width="1.2" marker-end="url(#arrow)" />
      <!-- Both into merge -->
      <path d="M 212,280 V 320 Q 212,328 220,328 H 420"
            fill="none" stroke="#71717a" stroke-width="1.2" marker-end="url(#arrow)" />
      <path d="M 668,280 V 320 Q 668,328 660,328 H 460"
            fill="none" stroke="#0891b2" stroke-width="1.4" marker-end="url(#arrow-accent)" />
      <line x1="440" y1="392" x2="440" y2="416" stroke="#71717a" stroke-width="1.2" marker-end="url(#arrow)" />

      <!-- Start oval -->
      <rect x="360" y="24" width="160" height="48" rx="24" fill="rgba(24,24,27,0.03)" stroke="rgba(24,24,27,0.30)" stroke-width="1" />
      <text x="440" y="52" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pair AB in corpus</text>

      <!-- Count step -->
      <rect x="340" y="96" width="200" height="64" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1" />
      <text x="440" y="132" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Count pair AB</text>

      <!-- BPE column -->
      <rect x="112" y="200" width="200" height="80" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1" />
      <text x="212" y="228" fill="#a1a1aa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">BPE</text>
      <text x="212" y="252" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pick max count(AB)</text>
      <text x="212" y="268" fill="#71717a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">frequency only</text>

      <!-- WordPiece column (focal) -->
      <rect x="568" y="200" width="200" height="80" rx="6" fill="rgba(8,145,178,0.10)" stroke="#0891b2" stroke-width="1.4" />
      <text x="668" y="228" fill="#0891b2" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">WORDPIECE</text>
      <text x="668" y="252" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pick max score</text>
      <text x="668" y="268" fill="#0891b2" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">freq(ab)/(freq(a)·freq(b))</text>

      <!-- Merge join -->
      <rect x="340" y="328" width="200" height="64" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1" />
      <text x="440" y="356" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Glue AB → vocab</text>
      <text x="440" y="376" fill="#71717a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">shared step</text>

      <!-- End -->
      <rect x="360" y="416" width="160" height="48" rx="24" fill="rgba(24,24,27,0.03)" stroke="rgba(24,24,27,0.30)" stroke-width="1" />
      <text x="440" y="444" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Encode later</text>

      <!-- Legend -->
      <line x1="40" y1="40" x2="40" y2="40" stroke="transparent" />
      <text x="40" y="456" fill="#71717a" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="120" y="444" width="14" height="14" rx="3" fill="rgba(8,145,178,0.10)" stroke="#0891b2" stroke-width="1.2" />
      <text x="142" y="455" fill="#18181b" font-size="11" font-family="'Geist', sans-serif">Likelihood score (WordPiece)</text>
    </svg>

    <a class="back" href="index.html">← All diagrams</a>
  </div>
</body>
</html>
