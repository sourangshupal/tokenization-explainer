<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tokenizer pipeline · Token Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #fafafa;
      --ink: #18181b;
      --muted: #71717a;
      --accent: #0891b2;
      --font-sans: "Geist", system-ui, sans-serif;
      --font-serif: "Instrument Serif", serif;
      --font-mono: "Geist Mono", ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1040px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 0.5rem;
    }
    .sub {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      max-width: 52ch;
    }
    svg { width: 100%; min-width: 720px; display: block; }
    .back {
      display: inline-block;
      margin-top: 1.5rem;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--accent);
      text-decoration: none;
      letter-spacing: 0.06em;
    }
    .back:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Token Lab / 01</p>
    <h1>Tokenizer pipeline</h1>
    <p class="sub">Six jobs in order. Skip one and lengths, unknowns, or multilingual text break later.</p>

    <svg viewBox="0 0 960 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tokenizer pipeline from raw text to decode">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#71717a" />
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#0891b2" />
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafafa" />

      <!-- Arrows first -->
      <line x1="140" y1="120" x2="168" y2="120" stroke="#71717a" stroke-width="1.2" marker-end="url(#arrow)" />
      <line x1="280" y1="120" x2="308" y2="120" stroke="#71717a" stroke-width="1.2" marker-end="url(#arrow)" />
      <line x1="420" y1="120" x2="448" y2="120" stroke="#71717a" stroke-width="1.2" marker-end="url(#arrow)" />
      <line x1="560" y1="120" x2="588" y2="120" stroke="#0891b2" stroke-width="1.4" marker-end="url(#arrow-accent)" />
      <line x1="700" y1="120" x2="728" y2="120" stroke="#71717a" stroke-width="1.2" marker-end="url(#arrow)" />

      <!-- 01 Raw -->
      <rect x="28" y="88" width="112" height="64" rx="20" fill="rgba(24,24,27,0.03)" stroke="rgba(24,24,27,0.30)" stroke-width="1" />
      <text x="84" y="112" fill="#a1a1aa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">01</text>
      <text x="84" y="132" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Raw text</text>

      <!-- 02 Normalize -->
      <rect x="168" y="88" width="112" height="64" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1" />
      <text x="224" y="112" fill="#a1a1aa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">02</text>
      <text x="224" y="132" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Normalize</text>

      <!-- 03 Pre-tokenize -->
      <rect x="308" y="88" width="112" height="64" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1" />
      <text x="364" y="112" fill="#a1a1aa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">03</text>
      <text x="364" y="132" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pre-tokenize</text>

      <!-- 04 Model (focal) -->
      <rect x="448" y="88" width="112" height="64" rx="6" fill="rgba(8,145,178,0.10)" stroke="#0891b2" stroke-width="1.4" />
      <text x="504" y="112" fill="#0891b2" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">04</text>
      <text x="504" y="132" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Model</text>

      <!-- 05 IDs -->
      <rect x="588" y="88" width="112" height="64" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1" />
      <text x="644" y="112" fill="#a1a1aa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">05</text>
      <text x="644" y="132" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">IDs</text>

      <!-- 06 Decode -->
      <rect x="728" y="88" width="112" height="64" rx="20" fill="rgba(24,24,27,0.03)" stroke="rgba(24,24,27,0.30)" stroke-width="1" />
      <text x="784" y="112" fill="#a1a1aa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">06</text>
      <text x="784" y="132" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Decode</text>

      <!-- Sublabels -->
      <text x="84" y="180" fill="#71717a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Unicode</text>
      <text x="224" y="180" fill="#71717a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">NFKC / case</text>
      <text x="364" y="180" fill="#71717a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">split rules</text>
      <text x="504" y="180" fill="#0891b2" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">word·sub·char·byte</text>
      <text x="644" y="180" fill="#71717a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">integers</text>
      <text x="784" y="180" fill="#71717a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">string back</text>

      <!-- Legend -->
      <line x1="28" y1="220" x2="932" y2="220" stroke="rgba(24,24,27,0.12)" stroke-width="0.8" />
      <text x="28" y="244" fill="#71717a" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="120" y="232" width="14" height="14" rx="3" fill="rgba(8,145,178,0.10)" stroke="#0891b2" stroke-width="1.2" />
      <text x="142" y="243" fill="#18181b" font-size="11" font-family="'Geist', sans-serif">Focal stage (granularity choice)</text>
      <rect x="420" y="232" width="28" height="14" rx="7" fill="rgba(24,24,27,0.03)" stroke="rgba(24,24,27,0.30)" stroke-width="1" />
      <text x="456" y="243" fill="#18181b" font-size="11" font-family="'Geist', sans-serif">Start / end</text>
      <rect x="580" y="232" width="20" height="14" rx="3" fill="#ffffff" stroke="#18181b" stroke-width="1" />
      <text x="608" y="243" fill="#18181b" font-size="11" font-family="'Geist', sans-serif">Step</text>
    </svg>

    <a class="back" href="index.html">← All diagrams</a>
  </div>
</body>
</html>
